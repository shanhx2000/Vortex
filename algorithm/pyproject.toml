[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-algorithm"
version = "0.1.0"
description = "Vortex artifact evaluation -- algorithm side: TEAL activation-sparsity search, AQLM/RVQ model conversion, and the checkpoint/threshold pipeline the hardware simulator consumes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
